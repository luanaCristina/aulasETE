<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salão Beleza & Arte — Sistema de Agendamentos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>💇 Salão Beleza & Arte</h1>
        <p>Sistema de Gestão de Agendamentos</p>
    </header>

    <main class="main">
        <!-- ==================== NOVO AGENDAMENTO ==================== -->
        <section class="card">
            <h2>📅 Novo Agendamento</h2>
            <form id="form-agendamento">
                <div class="form-row">
                    <div class="form-group">
                        <label for="cliente">Cliente</label>
                        <select id="cliente" required>
                            <option value="">Selecione o cliente...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="profissional">Profissional</label>
                        <select id="profissional" required>
                            <option value="">Selecione o profissional...</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="servico">Serviço</label>
                        <select id="servico" required>
                            <option value="">Selecione o serviço...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="data-hora">Data e Hora</label>
                        <input type="datetime-local" id="data-hora" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="observacoes">Observações (opcional)</label>
                    <textarea id="observacoes" rows="2" placeholder="Alguma preferência ou informação adicional..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Agendar</button>
            </form>

            <div id="feedback" class="feedback" hidden></div>
        </section>

        <!-- ==================== LISTA DE AGENDAMENTOS ==================== -->
        <section class="card">
            <h2>📋 Agendamentos</h2>
            <button class="btn btn-secondary" onclick="carregarAgendamentos()">🔄 Atualizar</button>

            <div id="lista-agendamentos" class="table-container">
                <p class="loading">Carregando agendamentos...</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Módulo II — ETE Advogado José David Gil Rodrigues</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
