# =============================================================
# CI/CD Pipeline — EcoColeta Recife
# GitHub Actions: Lint → Test → Build → Docker
# =============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ==================== TESTES ====================
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecocoleta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'modulo4TypeScript/package-lock.json'

      - name: Instalar dependências
        run: npm ci
        working-directory: ./modulo4TypeScript

      - name: Rodar linter
        run: npm run lint --if-present
        working-directory: ./modulo4TypeScript

      - name: Rodar testes
        run: npm test
        working-directory: ./modulo4TypeScript
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ecocoleta_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test-secret

      - name: Relatório de cobertura
        run: npm run test:coverage --if-present
        working-directory: ./modulo4TypeScript

  # ==================== BUILD ====================
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar e compilar
        run: |
          npm ci
          npm run build
        working-directory: ./modulo4TypeScript

  # ==================== DOCKER ====================
  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ecocoleta-api .
        working-directory: ./modulo4TypeScript

      - name: Verificar imagem
        run: docker images | grep ecocoleta-api
